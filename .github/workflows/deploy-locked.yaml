name: Terraform Deploy (Locked)

# Identical to deploy.yaml, except the job runs under a "<environment>-locked" GitHub Environment
# instead of the plain one. Configure that environment in the repo's Settings > Environments with
# required reviewers so a run pauses for approval before terraform apply/destroy actually executes
# - see .github/workflows/README.md. Use this one for anything destructive.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy."
        required: true
        type: choice
        options:
          - dev
          - test
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::${{ inputs.environment == 'dev' && '517293881120' || '690293068614' }}:role/${{ inputs.environment }}-datalake
  TF_WORKING_DIR: terraform/envs/${{ inputs.environment }}

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} (${{ inputs.environment }}, locked)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-locked

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve
