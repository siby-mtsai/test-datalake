name: Debug OIDC Token

# Prints the claims (sub, aud, repo, ref, etc.) inside the GitHub OIDC token this workflow would
# present to AWS, without actually calling AWS. Useful for checking a role's trust policy
# condition (e.g. token.actions.githubusercontent.com:sub) against what GitHub actually sends,
# before wiring up aws-actions/configure-aws-credentials for real. Mirrors
# mtsai-commuter-infra's debug-oidc.yml, parameterized with an environment input since this
# project has two GitHub Environments (dev, test) instead of one (prod).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment to run under (affects which environment-scoped secrets/protection rules apply)."
        required: true
        type: choice
        options:
          - dev
          - test

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Debug OIDC Token
        run: |
          echo "=== OIDC Token Debug ==="
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' \
            | jq -R 'split(".") | .[1] | @base64d | fromjson'
