name: Terraform deploy (normal)

# Runs immediately on trigger - no manual approval gate. Intended for routine dev/test apply
# cycles. For a gated run (e.g. before a destroy, or for a more sensitive environment), use
# "Terraform deploy (locked)" instead - see .github/workflows/README.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy."
        required: true
        type: choice
        options:
          - dev
          - test
      action:
        description: "Terraform action."
        required: true
        type: choice
        options:
          - apply
          - destroy

jobs:
  run:
    uses: ./.github/workflows/_terraform-run.yml
    with:
      environment: ${{ inputs.environment }}
      action: ${{ inputs.action }}
      github_environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
