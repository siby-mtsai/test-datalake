name: (reusable) Terraform apply/destroy

# Shared by terraform-deploy.yml (normal, immediate) and terraform-deploy-locked.yml
# (approval-gated). Not meant to be triggered directly - see docs/prompts convention and this
# directory's README for how the two callers differ.

on:
  workflow_call:
    inputs:
      environment:
        description: "terraform/envs/<environment> to run against (dev, test)."
        required: true
        type: string
      action:
        description: "apply or destroy."
        required: true
        type: string
      github_environment:
        description: "GitHub Environment name to run this job under (controls whether an approval gate applies)."
        required: true
        type: string

permissions:
  id-token: write # required for AWS OIDC
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    defaults:
      run:
        working-directory: terraform/envs/${{ inputs.environment }}

    steps:
      - name: Guard against unknown action
        if: ${{ inputs.action != 'apply' && inputs.action != 'destroy' }}
        run: |
          echo "::error::action must be 'apply' or 'destroy', got '${{ inputs.action }}'"
          exit 1

      - uses: actions/checkout@v4

      # TODO: confirm the actual OIDC role name/pattern against the aws-org handoff notes
      # (brief Section 7, Phase 1 step 3, references a "DeveloperPowerUser role" / OIDC pipeline).
      # This assumes one same-named role per account, created by that handoff.
      - name: Resolve target AWS account and role
        id: target
        run: |
          case "${{ inputs.environment }}" in
            dev)
              account_id=517293881120
              ;;
            test)
              account_id=690293068614
              ;;
            *)
              echo "::error::no known account_id for environment '${{ inputs.environment }}'"
              exit 1
              ;;
          esac
          echo "account_id=${account_id}" >> "$GITHUB_OUTPUT"
          echo "role_arn=arn:aws:iam::${account_id}:role/github-actions-terraform-datalake" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.target.outputs.role_arn }}
          aws-region: ap-south-1

      - uses: hashicorp/setup-terraform@v3
        with:
          # setup-terraform pins an exact version, not a range - keep in sync with
          # required_version in each env's providers.tf (currently ">= 1.15").
          terraform_version: "1.15.8"

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -var-file="${{ inputs.environment }}.tfvars" -out=tfplan
          else
            terraform plan -input=false -var-file="${{ inputs.environment }}.tfvars" -out=tfplan
          fi

      - name: Upload plan (audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ inputs.action }}-${{ github.run_id }}
          path: terraform/envs/${{ inputs.environment }}/tfplan
          retention-days: 90

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan
